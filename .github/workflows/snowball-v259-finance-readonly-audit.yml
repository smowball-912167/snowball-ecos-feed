name: SNOWBALL V259 Finance Read-only Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read-only ECOS historical metadata check (no publication)
        shell: bash
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY_V259'
          #!/usr/bin/env python3
          """SNOWBALL V259 finance missing-indicators audit. Read-only, never publishes values.
          Requires GitHub ECOS_API_KEY; leaves public Pages and existing 5/8 intact.
          """
          import datetime as dt
          import json
          import math
          import os
          import re
          import urllib.parse
          import urllib.request
          
          SPECS = {
              "kospi_d": ("0001000", "1980.01.04=100"),
              "kosdaq_d": ("0089000", "1996.07.01=1000"),
              "kospi_foreign_d": ("0030000", "억원"),
              "kosdaq_foreign_d": ("0113000", "억원"),
          }
          TABLE = "802Y001"
          ENDPOINT = "https://ecos.bok.or.kr/api/"
          DATE_RE = re.compile(r"20\d{6}")
          KEY_RE = re.compile(r"[A-Za-z0-9_-]{8,128}")
          
          class AuditError(Exception):
              pass
          
          
          def parse_ecos(raw, series_id):
              """Check identity, dimensions, units and duplicate conflicts; return date->value."""
              item, unit = SPECS[series_id]
              block = raw.get("StatisticSearch") if isinstance(raw, dict) else None
              if not isinstance(block, dict) or not isinstance(block.get("row"), list):
                  raise AuditError("INVALID_RESPONSE")
              try:
                  count = int(block.get("list_total_count", 0))
              except (ValueError, TypeError):
                  raise AuditError("COUNT_INVALID") from None
              if count > 900:
                  raise AuditError("PAGINATION_REQUIRED")
              rows = {}
              dims = set()
              for r in block["row"]:
                  if str(r.get("STAT_CODE", "")) != TABLE or str(r.get("ITEM_CODE1", "")) != item:
                      continue
                  if re.sub(r"\s+", "", str(r.get("UNIT_NAME", ""))) != unit:
                      continue
                  period = str(r.get("TIME", ""))
                  if not DATE_RE.fullmatch(period):
                      continue
                  dimension = tuple(str(r.get("ITEM_CODE" + str(i), "") or "").strip() for i in (2, 3, 4))
                  try:
                      value = float(str(r.get("DATA_VALUE", "")).replace(",", "").strip())
                  except (ValueError, TypeError):
                      continue
                  if not math.isfinite(value):
                      continue
                  if period in rows and rows[period] != (value, dimension):
                      raise AuditError("DUPLICATE_DATE")
                  rows[period] = (value, dimension)
                  dims.add(dimension)
              if len(dims) != 1:
                  raise AuditError("DIMENSIONS_AMBIGUOUS")
              if len(rows) < 20:
                  raise AuditError("NOT_ENOUGH_DAYS")
              return {k: v[0] for k, v in rows.items()}
          
          
          def matching_days(series, today):
              """Validate same 20 stock-market days and actual 20-day flow. No value output."""
              idx = sorted(set(series["kospi_d"]) & set(series["kosdaq_d"]))
              if len(idx) < 20:
                  raise AuditError("INDEX_HISTORY_SHORT")
              dates = idx[-20:]
              if dates[-1] != max(series["kospi_d"]) or dates[-1] != max(series["kosdaq_d"]):
                  raise AuditError("INDEX_LAST_DAY_DISAGREES")
              if max(series["kospi_foreign_d"]) != dates[-1] or max(series["kosdaq_foreign_d"]) != dates[-1]:
                  raise AuditError("FLOW_LAST_DAY_DISAGREES")
              if not all(day in series["kospi_foreign_d"] and day in series["kosdaq_foreign_d"] for day in dates):
                  raise AuditError("MISSING_TRADING_DAY")
              age = (today - dt.datetime.strptime(dates[-1], "%Y%m%d").date()).days
              if age < -1 or age > 12:
                  raise AuditError("STALE_OR_FUTURE")
              # Compute only to ensure bounded numeric range. Never print a market-data value.
              total = sum(series["kospi_foreign_d"][day] + series["kosdaq_foreign_d"][day] for day in dates)
              if not math.isfinite(total) or abs(total) >= 100000000:
                  raise AuditError("FLOW_OUT_OF_RANGE")
              return {"trading_days": 20, "latest": dates[-1], "age_days": age}
          
          
          def fetch_series(key, sid, today):
              begin = (today - dt.timedelta(days=90)).strftime("%Y%m%d")
              args = ["StatisticSearch", key, "json", "kr", "1", "900", TABLE, "D", begin,
                      today.strftime("%Y%m%d"), SPECS[sid][0]]
              url = ENDPOINT + "/".join(urllib.parse.quote(x, safe="") for x in args)
              try:
                  req = urllib.request.Request(url, headers={"Accept": "application/json", "User-Agent": "SNOWBALL-V259-PRIVATE-METADATA-AUDIT/1"})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      if r.status != 200 or r.geturl() != url:
                          raise AuditError("HTTP")
                      data = r.read(1500001)
                  if len(data) > 1500000:
                      raise AuditError("RESPONSE_TOO_LARGE")
                  return json.loads(data)
              except Exception:
                  # ECOS token lives in URL; never emit HTTP exception, URL, or traceback.
                  raise AuditError("ECOS_LOOKUP_FAILED") from None
          
          
          def main():
              key = os.environ.get("ECOS_API_KEY", "")
              if not KEY_RE.fullmatch(key):
                  print("V259 FOREIGN20 AUDIT: BLOCKED; missing existing ECOS_API_KEY")
                  return 0
              today = dt.datetime.now(dt.timezone(dt.timedelta(hours=9))).date()
              data = {}
              try:
                  for sid in SPECS:
                      data[sid] = parse_ecos(fetch_series(key, sid, today), sid)
                      print("V259 AUDIT:", sid, "metadata PASS; valid_dates=" + str(len(data[sid])))
                  match = matching_days(data, today)
                  print("V259 FOREIGN20 AUDIT: ELIGIBLE_SOURCE_SHAPE; trading_days=20 latest=" + match["latest"])
                  print("V259 FOREIGN20 PUBLICATION: BLOCKED_PENDING_REDISTRIBUTION_RIGHTS")
              except AuditError as exc:
                  # Strict whitelist prevents accidental credential disclosure in error logs.
                  safe = str(exc) if re.fullmatch(r"[A-Z_]{2,50}", str(exc)) else "VALIDATION_FAILED"
                  print("V259 FOREIGN20 AUDIT: NOT_READY;", safe)
              print("V259 VKOSPI: UNPUBLISHED; FSC index API has KRX third-party redistribution restrictions")
              print("V259 CREDIT_RATIO: UNPUBLISHED; no approved definition/denominator")
              print("V259 RESULT: READ_ONLY; no repo files, API keys, Pages, or existing feed modified")
              return 0
          
          if __name__ == "__main__":
              raise SystemExit(main())
          PY_V259
